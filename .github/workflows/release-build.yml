name: Release CamillaFIR

on:
  push:
    tags:
      - "v*.*.*"   # e.g. v2.8.3
      - "v*-beta*"
      - "v*-rc*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (Linux pinned Plotly/Kaleido)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt
          pip install pyinstaller
      
      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate build_version.py
        shell: bash
        run: |
          cat > build_version.py << 'EOF'
          VERSION = "${{ env.VERSION }}"
          TAG = "${{ env.TAG }}"
          EOF

      - name: Build (Linux) using linux spec
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rm -rf build dist
          pyinstaller --clean --noconfirm CamillaFIR_linux.spec

      - name: Build (Windows) using standalone spec
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rm -rf build dist
          pyinstaller --clean --noconfirm CamillaFIR_standalone.spec

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path dist\CamillaFIR\* -DestinationPath out\CamillaFIR_${{ env.VERSION }}_windows.zip

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p out
          chmod +x dist/CamillaFIR/CamillaFIR || true

          cat > dist/CamillaFIR/run.sh << 'EOF'
          #!/usr/bin/env sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/CamillaFIR" "$@"
          EOF
          chmod +x dist/CamillaFIR/run.sh

          cat > dist/CamillaFIR/README.txt << 'EOF'
          CamillaFIR Linux portable build

          Start with:
              ./run.sh

          If needed, ensure executable permissions:
              chmod +x CamillaFIR
          EOF

          tar -C dist -czf out/CamillaFIR_${VERSION}_linux.tar.gz CamillaFIR

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamillaFIR-${{ env.VERSION }}-${{ runner.os }}
          path: out/*

  macos_arm64:
    name: macOS arm64 build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "arm64"
          cache: "pip"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - run: |
          rm -rf build dist
          pyinstaller --clean --noconfirm CamillaFIR_standalone.spec
          file dist/CamillaFIR/CamillaFIR
          lipo -archs dist/CamillaFIR/CamillaFIR || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos_arm64
          path: dist/CamillaFIR

  macos_x86_64:
    name: macOS x86_64 build (Rosetta)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta
        shell: bash
        run: |
          softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Install deps (force x86_64)
        shell: bash
        run: |
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 pip install -r requirements.txt
          arch -x86_64 pip install pyinstaller

      - name: Build (force x86_64)
        shell: bash
        run: |
          rm -rf build dist
          arch -x86_64 pyinstaller --clean --noconfirm CamillaFIR_standalone.spec
          file dist/CamillaFIR/CamillaFIR
          lipo -archs dist/CamillaFIR/CamillaFIR || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos_x86_64
          path: dist/CamillaFIR

  macos_universal2:
    name: macOS universal2
    runs-on: macos-14
    needs: [macos_arm64, macos_x86_64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos_arm64
          path: inputs/arm64/CamillaFIR

      - uses: actions/download-artifact@v4
        with:
          name: macos_x86_64
          path: inputs/x86_64/CamillaFIR

      - run: |
          rm -rf dist_universal
          mkdir -p dist_universal
          rsync -a inputs/arm64/CamillaFIR/ dist_universal/CamillaFIR/

          lipo -create \
            inputs/arm64/CamillaFIR/CamillaFIR \
            inputs/x86_64/CamillaFIR/CamillaFIR \
            -output dist_universal/CamillaFIR/CamillaFIR

          echo "Universal architectures:"
          lipo -archs dist_universal/CamillaFIR/CamillaFIR

      - run: |
          mkdir -p out
          tar -C dist_universal -czf out/CamillaFIR_${{ github.ref_name }}_macos_universal2.tar.gz CamillaFIR

      - uses: actions/upload-artifact@v4
        with:
          name: macos_universal2
          path: out/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build, macos_universal2]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes from docs/CHANGELOG.md
        shell: bash
        run: |
          python - << 'PY'
          import os, re, pathlib
          version = os.environ.get("VERSION", "").strip()
          tag = os.environ.get("TAG", "").strip()
          candidates = ["docs/CHANGELOG.md", "docs/changelog.md", "CHANGELOG.md", "changelog.md"]
          changelog = None
          for p in candidates:
              pp = pathlib.Path(p)
              if pp.exists():
                  changelog = pp
                  break
          out = pathlib.Path("RELEASE_NOTES.md")
          if not tag:
              tag = f"v{version}" if version else "release"
          if changelog is None:
              out.write_text(f"# {tag}\n\nNo changelog found.\n", encoding="utf-8")
              raise SystemExit(0)
          text = changelog.read_text(encoding="utf-8", errors="ignore")
          pat = re.compile(
              r"^##\s*(?:\[\s*)?(?:v)?"
              + re.escape(version)
              + r"(?:\s*\])?(?:\s*-.*)?\s*$",
              re.IGNORECASE | re.MULTILINE
          )
          m = pat.search(text)
          if not m:
              out.write_text(
                  f"# {tag}\n\nVersion {version} not found in {changelog.as_posix()}.\n",
                  encoding="utf-8"
              )
              raise SystemExit(0)
          start = m.end()
          m2 = re.search(r"^##\s+", text[start:], flags=re.MULTILINE)
          end = start + (m2.start() if m2 else len(text[start:]))
          body = text[start:end].strip() or "No details listed for this version."
          out.write_text(f"# {tag}\n\n{body}\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CamillaFIR ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        retry-max-attempts: 3
        retry-on: rate-limit-error
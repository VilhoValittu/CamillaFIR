name: Release CamillaFIR (Win / macOS / Linux)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Optional but recommended: version injected for UI / summary
      - name: Generate build_version.py
        shell: bash
        run: |
          cat > build_version.py << 'EOF'
          VERSION = "${{ env.VERSION }}"
          TAG = "${{ env.TAG }}"
          EOF

      - name: Build using PyInstaller spec
        shell: bash
        run: |
          pyinstaller --clean --noconfirm CamillaFIR_onedir_slim.spec

      # -------- Packaging per OS --------

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive `
            -Path dist/CamillaFIR/* `
            -DestinationPath out/CamillaFIR_${{ env.VERSION }}_windows.zip

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p out
          tar -C dist -czf out/CamillaFIR_${VERSION}_linux.tar.gz CamillaFIR
          chmod +x dist/CamillaFIR/CamillaFIR

      - name: Package macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p out
          tar -C dist -czf out/CamillaFIR_${VERSION}_macos.tar.gz CamillaFIR

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamillaFIR-${{ env.VERSION }}-${{ runner.os }}
          path: out/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes from docs/Changelog.md
  shell: bash
  run: |
    python - << 'PY'
    import os, re, pathlib

    version = os.environ["VERSION"]
    tag = os.environ["TAG"]

    changelog = pathlib.Path("docs/Changelog.md")
    out = pathlib.Path("RELEASE_NOTES.md")

    if not changelog.exists():
        out.write_text(f"# {tag}\n\nNo changelog found at docs/Changelog.md.\n")
        exit(0)

    text = changelog.read_text(encoding="utf-8", errors="ignore")

    pattern = re.compile(
        rf"^##\s*(?:\[)?v?{re.escape(version)}(?:\])?.*$",
        re.MULTILINE
    )

    match = pattern.search(text)
    if not match:
        out.write_text(
            f"# {tag}\n\n"
            f"Version {version} not found in docs/Changelog.md.\n"
        )
        exit(0)

    start = match.end()
    next_match = re.search(r"^##\s+", text[start:], re.MULTILINE)
    end = start + (next_match.start() if next_match else len(text))

    body = text[start:end].strip()
    if not body:
        body = "No details listed for this version."

    out.write_text(f"# {tag}\n\n{body}\n")
    PY


      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CamillaFIR ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

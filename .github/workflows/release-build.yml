name: Release CamillaFIR (Win / macOS / Linux)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Optional but recommended: version injected for UI / summary
      - name: Generate build_version.py
        shell: bash
        run: |
          cat > build_version.py << 'EOF'
          VERSION = "${{ env.VERSION }}"
          TAG = "${{ env.TAG }}"
          EOF

      - name: Build using PyInstaller spec
        shell: bash
        run: |
          pyinstaller --clean --noconfirm CamillaFIR_onedir_slim.spec

      # -------- Packaging per OS --------

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive `
            -Path dist/CamillaFIR/* `
            -DestinationPath out/CamillaFIR_${{ env.VERSION }}_windows.zip

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p out
          tar -C dist -czf out/CamillaFIR_${VERSION}_linux.tar.gz CamillaFIR
          chmod +x dist/CamillaFIR/CamillaFIR

      - name: Package macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p out
          tar -C dist -czf out/CamillaFIR_${VERSION}_macos.tar.gz CamillaFIR

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamillaFIR-${{ env.VERSION }}-${{ runner.os }}
          path: out/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

            - name: Generate release notes from docs/CHANGELOG.md
        shell: bash
        run: |
          python - << 'PY'
          import os, re, pathlib

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]

          # NOTE: case-sensitive on Linux runners:
          changelog = pathlib.Path("docs/CHANGELOG.md")
          out = pathlib.Path("RELEASE_NOTES.md")

          if not changelog.exists():
              out.write_text(f"# {tag}\n\nNo changelog found at docs/CHANGELOG.md.\n", encoding="utf-8")
              raise SystemExit(0)

          text = changelog.read_text(encoding="utf-8", errors="ignore")

          # Matches headings like:
          # ## 2.8.3
          # ## v2.8.3
          # ## [2.8.3] - 2026-02-01
          pattern = re.compile(
              r"^##\s*(?:\[\s*)?(?:v)?"+re.escape(version)+r"(?:\s*\])?(?:\s*-.*)?\s*$",
              re.IGNORECASE | re.MULTILINE
          )

          m = pattern.search(text)
          if not m:
              out.write_text(
                  f"# {tag}\n\nVersion {version} not found in docs/CHANGELOG.md.\n",
                  encoding="utf-8"
              )
              raise SystemExit(0)

          start = m.end()
          m2 = re.search(r"^##\s+", text[start:], flags=re.MULTILINE)
          end = start + (m2.start() if m2 else len(text[start:]))

          body = text[start:end].strip() or "No details listed for this version."
          out.write_text(f"# {tag}\n\n{body}\n", encoding="utf-8")
          PY



      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CamillaFIR ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release CamillaFIR

on:
  push:
    tags:
      - "v*.*.*"   # e.g. v2.8.3
      - "v*-beta*"
      - "v*-rc*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Python
        if: runner.os != 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (Linux pinned Plotly/Kaleido)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt
          pip install pyinstaller
      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller


      - name: Generate build_version.py
        shell: bash
        run: |
          cat > build_version.py << 'EOF'
          VERSION = "${{ env.VERSION }}"
          TAG = "${{ env.TAG }}"
          EOF

      # -------- Build per OS (SPEC selection) --------

      - name: Build (Linux) using linux spec
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rm -rf build dist
          pyinstaller --clean --noconfirm CamillaFIR_linux.spec

      - name: Build (Windows) using standalone spec
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rm -rf build dist
          pyinstaller --clean --noconfirm CamillaFIR_standalone.spec

      # -------- macOS universal2 build (arm64 + x86_64 -> lipo) --------

      - name: macOS Install Rosetta (needed for x86_64 on Apple Silicon runners)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: Set up Python (macOS arm64)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "arm64"
          cache: "pip"

      - name: Install Python dependencies (macOS arm64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (macOS arm64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf build_arm dist_arm
          pyinstaller --clean --noconfirm CamillaFIR_standalone.spec \
            --workpath build_arm --distpath dist_arm

      - name: Set up Python (macOS x86_64)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Install Python dependencies (macOS x86_64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (macOS x86_64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf build_x86 dist_x86
          pyinstaller --clean --noconfirm CamillaFIR_standalone.spec \
            --workpath build_x86 --distpath dist_x86

      - name: Create universal2 executable (lipo)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf dist_universal
          mkdir -p dist_universal
          rsync -a dist_arm/CamillaFIR/ dist_universal/CamillaFIR/

          lipo -create \
            dist_arm/CamillaFIR/CamillaFIR \
            dist_x86/CamillaFIR/CamillaFIR \
            -output dist_universal/CamillaFIR/CamillaFIR

          chmod +x dist_universal/CamillaFIR/CamillaFIR || true
          file dist_universal/CamillaFIR/CamillaFIR
          lipo -archs dist_universal/CamillaFIR/CamillaFIR

      - name: Smoke test (macOS universal2 sanity)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          BIN="dist_universal/CamillaFIR/CamillaFIR"

          echo "== file =="
          file "$BIN"

          echo "== lipo -archs =="
          lipo -archs "$BIN" | tee /tmp/archs.txt
          grep -q "arm64" /tmp/archs.txt
          grep -q "x86_64" /tmp/archs.txt

          echo "== otool -L (top deps) =="
          otool -L "$BIN" | head -n 40

      - name: Smoke test (macOS launch for 5s)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist_universal/CamillaFIR/CamillaFIR"

          echo "Starting CamillaFIR briefly..."
          ( "$BIN" >/tmp/camillafir_smoke.log 2>&1 & echo $! > /tmp/camillafir.pid )

          sleep 5

          PID="$(cat /tmp/camillafir.pid)"
          if ps -p "$PID" >/dev/null 2>&1; then
            echo "Process still alive after 5s (good). Stopping..."
            kill "$PID" || true
            sleep 2
            kill -9 "$PID" || true
          else
            echo "Process exited early — printing log:"
            sed -n '1,200p' /tmp/camillafir_smoke.log
            exit 1
          fi

          echo "Log (first 200 lines):"
          sed -n '1,200p' /tmp/camillafir_smoke.log


      # -------- Packaging per OS --------

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path dist\CamillaFIR\* -DestinationPath out\CamillaFIR_${{ env.VERSION }}_windows.zip

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p out
          chmod +x dist/CamillaFIR/CamillaFIR || true

          cat > dist/CamillaFIR/run.sh << 'EOF'
          #!/usr/bin/env sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/CamillaFIR" "$@"
          EOF
          chmod +x dist/CamillaFIR/run.sh

          cat > dist/CamillaFIR/README.txt << 'EOF'
          CamillaFIR Linux portable build

          Start with:
              ./run.sh

          If needed, ensure executable permissions:
              chmod +x CamillaFIR
          EOF

          tar -C dist -czf out/CamillaFIR_${VERSION}_linux.tar.gz CamillaFIR

      - name: Package macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p out
          chmod +x dist_universal/CamillaFIR/CamillaFIR || true
          tar -C dist_universal -czf out/CamillaFIR_${VERSION}_macos_universal2.tar.gz CamillaFIR

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamillaFIR-${{ env.VERSION }}-${{ runner.os }}
          path: out/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes from docs/CHANGELOG.md
        shell: bash
        run: |
          python - << 'PY'
          import os, re, pathlib
          version = os.environ.get("VERSION", "").strip()
          tag = os.environ.get("TAG", "").strip()
          candidates = ["docs/CHANGELOG.md", "docs/changelog.md", "CHANGELOG.md", "changelog.md"]
          changelog = None
          for p in candidates:
              pp = pathlib.Path(p)
              if pp.exists():
                  changelog = pp
                  break
          out = pathlib.Path("RELEASE_NOTES.md")
          if not tag:
              tag = f"v{version}" if version else "release"
          if changelog is None:
              out.write_text(f"# {tag}\n\nNo changelog found.\n", encoding="utf-8")
              raise SystemExit(0)
          text = changelog.read_text(encoding="utf-8", errors="ignore")
          pat = re.compile(
              r"^##\s*(?:\[\s*)?(?:v)?"
              + re.escape(version)
              + r"(?:\s*\])?(?:\s*-.*)?\s*$",
              re.IGNORECASE | re.MULTILINE
          )
          m = pat.search(text)
          if not m:
              out.write_text(
                  f"# {tag}\n\nVersion {version} not found in {changelog.as_posix()}.\n",
                  encoding="utf-8"
              )
              raise SystemExit(0)
          start = m.end()
          m2 = re.search(r"^##\s+", text[start:], flags=re.MULTILINE)
          end = start + (m2.start() if m2 else len(text[start:]))
          body = text[start:end].strip() or "No details listed for this version."
          out.write_text(f"# {tag}\n\n{body}\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CamillaFIR ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

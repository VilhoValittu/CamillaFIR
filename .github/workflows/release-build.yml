concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

name: Release CamillaFIR

on:
  push:
    tags:
      - "v*"


permissions:
  contents: write

jobs:
  test:
    name: Test suite (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt
          pip install pytest

      - name: Run tests
        shell: bash
        run: |
          python -m pytest -q tests

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies (Linux pinned Plotly/Kaleido)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt
          pip install pyinstaller
      
      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate build_version.py
        shell: bash
        run: |
          cat > build_version.py << 'EOF'
          VERSION = "${{ env.VERSION }}"
          TAG = "${{ env.TAG }}"
          EOF

      - name: Build (Linux) using linux spec
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rm -rf build dist
          pyinstaller --clean --noconfirm CamillaFIR_linux.spec

      - name: Verify packaged user manual (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f dist/CamillaFIR/docs/User_Manual.md

      - name: Smoke test startup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/CamillaFIR/CamillaFIR || true
          dist/CamillaFIR/CamillaFIR > smoke_linux.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..45}; do
            if curl -fsS "http://127.0.0.1:8080" >/dev/null; then
              echo "Linux startup smoke test passed."
              exit 0
            fi
            sleep 1
          done

          echo "Linux startup smoke test FAILED."
          tail -n 200 smoke_linux.log || true
          exit 1

      - name: Build (Windows) using standalone spec
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rm -rf build dist
          pyinstaller --clean --noconfirm CamillaFIR_standalone.spec

      - name: Verify packaged user manual (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\CamillaFIR\docs\User_Manual.md")) {
            throw "Packaged user manual missing from Windows build"
          }

      - name: Smoke test startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\CamillaFIR\CamillaFIR.exe" -PassThru `
            -RedirectStandardOutput "smoke_windows.out.log" `
            -RedirectStandardError "smoke_windows.err.log"
          try {
            $ok = $false
            for ($i = 0; $i -lt 45; $i++) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8080" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -ge 200) {
                  $ok = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ok) {
              Write-Output "Windows startup smoke test FAILED."
              if (Test-Path "smoke_windows.out.log") { Get-Content "smoke_windows.out.log" -Tail 200 }
              if (Test-Path "smoke_windows.err.log") { Get-Content "smoke_windows.err.log" -Tail 200 }
              exit 1
            }
            Write-Output "Windows startup smoke test passed."
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path dist\CamillaFIR\* -DestinationPath out\CamillaFIR_${{ env.VERSION }}_windows.zip

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p out
          chmod +x dist/CamillaFIR/CamillaFIR || true

          cat > dist/CamillaFIR/run.sh << 'EOF'
          #!/usr/bin/env sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/CamillaFIR" "$@"
          EOF
          chmod +x dist/CamillaFIR/run.sh

          cp src/camillafir/ui/assets/camillafir_logo.png dist/CamillaFIR/CamillaFIR.png

          cat > dist/CamillaFIR/install-desktop-entry.sh << 'EOF'
          #!/usr/bin/env sh
          set -eu

          DIR="$(CDPATH= cd -- "$(dirname "$0")" && pwd)"
          DESKTOP_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/applications"
          DESKTOP_FILE="$DESKTOP_DIR/CamillaFIR.desktop"

          mkdir -p "$DESKTOP_DIR"

          cat > "$DESKTOP_FILE" << DESKTOP_EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=CamillaFIR
          Comment=CamillaFIR portable build
          Exec=$DIR/run.sh
          Icon=$DIR/CamillaFIR.png
          Terminal=false
          Categories=AudioVideo;Audio;
          DESKTOP_EOF

          update-desktop-database "$DESKTOP_DIR" >/dev/null 2>&1 || true
          printf 'Installed desktop entry: %s\n' "$DESKTOP_FILE"
          EOF
          chmod +x dist/CamillaFIR/install-desktop-entry.sh

          cat > dist/CamillaFIR/README.txt << 'EOF'
          CamillaFIR Linux portable build

          Start with:
              ./run.sh

          If needed, ensure executable permissions:
              chmod +x CamillaFIR

          Optional desktop launcher with app icon:
              ./install-desktop-entry.sh
          EOF

          tar -C dist -czf out/CamillaFIR_${VERSION}_linux.tar.gz CamillaFIR

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamillaFIR-${{ env.VERSION }}-${{ runner.os }}
          path: out/*

  macos_arm64:
    name: macOS arm64 build
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "arm64"
          cache: "pip"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - run: |
          rm -rf build dist
          pyinstaller --clean --noconfirm CamillaFIR_macos.spec
          file dist/CamillaFIR.app/Contents/MacOS/CamillaFIR
          lipo -archs dist/CamillaFIR.app/Contents/MacOS/CamillaFIR || true

      - name: Verify packaged user manual (macOS arm64)
        shell: bash
        run: |
          find dist/CamillaFIR.app -path "*docs/User_Manual.md" -print -quit | grep -q .

      - name: Smoke test startup (macOS arm64)
        shell: bash
        run: |
          set -euo pipefail
          export MPLCONFIGDIR="$RUNNER_TEMP/mplconfig_arm64"
          mkdir -p "$MPLCONFIGDIR"
          # Warm up Matplotlib cache to avoid first-run startup delay in packaged app.
          python - << 'PY'
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt  # noqa: F401
          PY

          dist/CamillaFIR.app/Contents/MacOS/CamillaFIR > smoke_macos_arm64.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..180}; do
            if curl -fsS "http://127.0.0.1:8080" >/dev/null; then
              echo "macOS arm64 startup smoke test passed."
              exit 0
            fi
            sleep 1
          done

          echo "macOS arm64 startup smoke test FAILED."
          tail -n 200 smoke_macos_arm64.log || true
          exit 1

      - name: Package macOS arm64 build
        shell: bash
        run: |
          mkdir -p out
          tar -C dist -czf out/CamillaFIR_${VERSION}_macos_arm64.tar.gz CamillaFIR.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos_arm64
          path: out/*.tar.gz

  macos_x86_64:
    name: macOS x86_64 build
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Ensure Rosetta is available
        shell: bash
        run: |
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"

      - name: Install deps
        shell: bash
        run: |
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 pip install -r requirements.txt
          arch -x86_64 pip install pyinstaller

      - name: Build x86_64
        shell: bash
        run: |
          rm -rf build dist
          arch -x86_64 pyinstaller --clean --noconfirm CamillaFIR_macos.spec
          file dist/CamillaFIR.app/Contents/MacOS/CamillaFIR
          lipo -archs dist/CamillaFIR.app/Contents/MacOS/CamillaFIR || true

      - name: Verify packaged user manual (macOS x86_64)
        shell: bash
        run: |
          find dist/CamillaFIR.app -path "*docs/User_Manual.md" -print -quit | grep -q .

      - name: Smoke test startup (macOS x86_64)
        shell: bash
        run: |
          set -euo pipefail
          export MPLCONFIGDIR="$RUNNER_TEMP/mplconfig_x86_64"
          mkdir -p "$MPLCONFIGDIR"
          # Warm up Matplotlib cache under Rosetta/x86_64 before starting the app.
          arch -x86_64 python - << 'PY'
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt  # noqa: F401
          PY

          arch -x86_64 dist/CamillaFIR.app/Contents/MacOS/CamillaFIR > smoke_macos_x86_64.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..180}; do
            if curl -fsS "http://127.0.0.1:8080" >/dev/null; then
              echo "macOS x86_64 startup smoke test passed."
              exit 0
            fi
            sleep 1
          done

          echo "macOS x86_64 startup smoke test FAILED."
          tail -n 200 smoke_macos_x86_64.log || true
          exit 1

      - name: Package macOS x86_64 build
        shell: bash
        run: |
          mkdir -p out
          tar -C dist -czf out/CamillaFIR_${VERSION}_macos_x86_64.tar.gz CamillaFIR.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos_x86_64
          path: out/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build, macos_arm64, macos_x86_64]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          if [[ "${GITHUB_REF_NAME}" == *-beta* || "${GITHUB_REF_NAME}" == *-rc* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes from docs/CHANGELOG.md
        shell: bash
        run: |
          python - << 'PY'
          import os, re, pathlib
          version = os.environ.get("VERSION", "").strip()
          tag = os.environ.get("TAG", "").strip()
          candidates = ["docs/CHANGELOG.md", "docs/changelog.md", "CHANGELOG.md", "changelog.md"]
          changelog = None
          for p in candidates:
              pp = pathlib.Path(p)
              if pp.exists():
                  changelog = pp
                  break
          out = pathlib.Path("RELEASE_NOTES.md")
          if not tag:
              tag = f"v{version}" if version else "release"
          if changelog is None:
              out.write_text(f"# {tag}\n\nNo changelog found.\n", encoding="utf-8")
              raise SystemExit(0)
          text = changelog.read_text(encoding="utf-8", errors="ignore")
          pat = re.compile(
              r"^##\s*(?:\[\s*)?(?:v)?"
              + re.escape(version)
              + r"(?:\s*\])?(?:\s*-.*)?\s*$",
              re.IGNORECASE | re.MULTILINE
          )
          m = pat.search(text)
          if not m:
              out.write_text(
                  f"# {tag}\n\nVersion {version} not found in {changelog.as_posix()}.\n",
                  encoding="utf-8"
              )
              raise SystemExit(0)
          start = m.end()
          m2 = re.search(r"^##\s+", text[start:], flags=re.MULTILINE)
          end = start + (m2.start() if m2 else len(text[start:]))
          body = text[start:end].strip() or "No details listed for this version."
          out.write_text(f"# {tag}\n\n{body}\n", encoding="utf-8")
          PY


      # If a previous run partially created the release / assets, softprops may hit
      # "Not Found - update a release asset". Deleting the existing release makes
      # the workflow idempotent.
      - name: Delete existing GitHub Release (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release delete "${{ env.TAG }}" --yes || true

      - name: Debug artifact tree
        run: ls -R artifacts

      
      - name: Create GitHub Release
        shell: bash
        run: |
          echo "${{ secrets.RELEASE_TOKEN }}" | gh auth login --with-token
          gh release create "${{ env.TAG }}" \
            artifacts/**/*.zip \
            artifacts/**/*.tar.gz \
            --title "CamillaFIR ${{ env.VERSION }}" \
            --notes-file RELEASE_NOTES.md \
            $([[ "${{ env.IS_PRERELEASE }}" == "true" ]] && echo "--prerelease")
            

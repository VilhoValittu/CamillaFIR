name: Release CamillaFIR (Beta/RC)

on:
  push:
    tags:
      - "v*.*.*"      # e.g. v2.8.3
      - "v*-beta*"
      - "v*-rc*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Optional: makes it easy to show exact release version inside the app
      - name: Generate build_version.py
        shell: bash
        run: |
          cat > build_version.py << 'EOF'
          VERSION = "${{ env.VERSION }}"
          TAG = "${{ env.TAG }}"
          EOF

      # ---------------- Build per OS ----------------

      - name: Build (Windows, onefile)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile CamillaFIR_standalone.spec
          Get-ChildItem -Recurse dist | Select-Object FullName

      - name: Build (Linux, onedir)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --clean --noconfirm --onedir CamillaFIR_standalone.spec
          find dist -maxdepth 3 -type f | head -n 200

      - name: Build (macOS, onefile)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --clean --noconfirm --onefile CamillaFIR_standalone.spec
          find dist -maxdepth 3 -type f | head -n 200

      # ---------------- Packaging per OS ----------------

      - name: Package Windows build (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null

          $exe1 = "dist\CamillaFIR.exe"
          $exe2 = "dist\CamillaFIR"

          if (Test-Path $exe1) {
            Compress-Archive -Path $exe1 -DestinationPath "out\CamillaFIR_${{ env.VERSION }}_windows.zip"
          } elseif (Test-Path $exe2) {
            Compress-Archive -Path $exe2 -DestinationPath "out\CamillaFIR_${{ env.VERSION }}_windows.zip"
          } else {
            Write-Error "Could not find CamillaFIR executable in dist/"
          }

      - name: Package Linux build (tar.gz, onedir)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p out

          # Ensure binary is executable
          chmod +x dist/CamillaFIR/CamillaFIR

          # Create run.sh
          cat > dist/CamillaFIR/run.sh << 'EOF'
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/CamillaFIR" "$@"
          EOF
          chmod +x dist/CamillaFIR/run.sh

          # Create README
          cat > dist/CamillaFIR/README.txt << 'EOF'
          CamillaFIR Linux portable build

          Start with:
              ./run.sh

          If needed, ensure executable permissions:
              chmod +x CamillaFIR
          EOF

          tar -C dist -czf out/CamillaFIR_${VERSION}_linux.tar.gz CamillaFIR


                  - name: Package macOS build (tar.gz)
                    if: runner.os == 'macOS'
                    shell: bash
                    run: |
                      mkdir -p out
                      chmod +x dist/CamillaFIR || true
                      tar -C dist -czf out/CamillaFIR_${VERSION}_macos.tar.gz CamillaFIR

                  - name: Upload build artifact
                    uses: actions/upload-artifact@v4
                    with:
                      name: CamillaFIR-${{ env.VERSION }}-${{ runner.os }}
                      path: out/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes from docs/CHANGELOG.md
        shell: bash
        run: |
          python - << 'PY'
          import os, re, pathlib

          version = os.environ.get("VERSION", "").strip()
          tag = os.environ.get("TAG", "").strip()

          candidates = ["docs/CHANGELOG.md", "docs/changelog.md", "CHANGELOG.md", "changelog.md"]
          changelog = None
          for p in candidates:
              pp = pathlib.Path(p)
              if pp.exists():
                  changelog = pp
                  break

          out = pathlib.Path("RELEASE_NOTES.md")

          if not tag:
              tag = f"v{version}" if version else "release"

          if changelog is None:
              out.write_text(f"# {tag}\n\nNo changelog found.\n", encoding="utf-8")
              raise SystemExit(0)

          text = changelog.read_text(encoding="utf-8", errors="ignore")

          pat = re.compile(
              r"^##\s*(?:\[\s*)?(?:v)?"
              + re.escape(version)
              + r"(?:\s*\])?(?:\s*-.*)?\s*$",
              re.IGNORECASE | re.MULTILINE
          )

          m = pat.search(text)
          if not m:
              out.write_text(
                  f"# {tag}\n\n"
                  f"Version {version} not found in {changelog.as_posix()}.\n",
                  encoding="utf-8"
              )
              raise SystemExit(0)

          start = m.end()
          m2 = re.search(r"^##\s+", text[start:], flags=re.MULTILINE)
          end = start + (m2.start() if m2 else len(text[start:]))

          body = text[start:end].strip() or "No details listed for this version."
          out.write_text(f"# {tag}\n\n{body}\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CamillaFIR ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
